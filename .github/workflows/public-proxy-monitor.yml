name: Validate and publish public proxy exports

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-proxy-pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: public_monitor/requirements.txt

      - name: Install monitor dependencies
        run: python -m pip install --disable-pip-version-check -r public_monitor/requirements.txt

      - name: Validate public proxies and build site
        run: |
          python -m public_monitor.run \
            --sources public_monitor/sources.ini \
            --output public_site \
            --top 20 \
            --max-candidates 700 \
            --workers 96 \
            --timeout 5 \
            --probes 2

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public_site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
