<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#101820">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}ProxyPool Control Plane{% endblock %}</title>
  <link rel="icon" href="{{ url_for('favicon') }}" sizes="any">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', saved || preferred);
      } catch (_error) {}
    }());
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/shell.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/inventory.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sources.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/validation.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/serving.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/insights.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/operations.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='js/base.js') }}"></script>
  <script src="{{ url_for('static', filename='js/inventory.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sources.js') }}"></script>
  <script src="{{ url_for('static', filename='js/validation.js') }}"></script>
  <script src="{{ url_for('static', filename='js/serving.js') }}"></script>
  <script src="{{ url_for('static', filename='js/insights.js') }}"></script>
  <script src="{{ url_for('static', filename='js/operations.js') }}"></script>
  <script src="{{ url_for('static', filename='js/access.js') }}"></script>
  <script src="{{ url_for('static', filename='js/shell.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
